<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meowmatch - Find Your Purrfect Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --coral: #FF6B6B;
            --peach: #FFE66D;
            --mint: #4ECDC4;
            --lavender: #C7CEEA;
            --cream: #FFF8F3;
            --charcoal: #2D2D3A;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #FFE4E1 0%, #E6F3FF 50%, #F0E6FF 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 182, 193, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(173, 216, 230, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(221, 160, 221, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        header {
            padding: 24px 20px 16px;
            text-align: center;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--coral), var(--mint));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--charcoal);
            opacity: 0.7;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px 100px;
            position: relative;
        }

        .card-stack {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 3/4;
            perspective: 1000px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            background: white;
            box-shadow: var(--shadow-lg);
            cursor: grab;
            touch-action: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .card:active {
            cursor: grabbing;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.4));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card.swiping .card-overlay {
            opacity: 1;
        }

        .card-indicator {
            position: absolute;
            top: 24px;
            padding: 12px 24px;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 2;
        }

        .card-indicator.like {
            left: 24px;
            background: rgba(78, 205, 196, 0.95);
            color: white;
            border: 3px solid white;
            box-shadow: 0 4px 12px rgba(78, 205, 196, 0.4);
        }

        .card-indicator.nope {
            right: 24px;
            background: rgba(255, 107, 107, 0.95);
            color: white;
            border: 3px solid white;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        .card.swiping-right .card-indicator.like,
        .card.swiping-left .card-indicator.nope {
            opacity: 1;
        }

        .card-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            color: var(--charcoal);
            box-shadow: var(--shadow-md);
        }

        .action-buttons {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
            animation: slideUp 0.6s ease-out 0.3s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .action-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .action-btn.nope {
            background: var(--coral);
        }

        .action-btn.like {
            background: var(--mint);
            width: 80px;
            height: 80px;
            font-size: 36px;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .action-btn:active:hover {
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            color: var(--charcoal);
            opacity: 0.8;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .summary {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.6s ease-out;
            max-width: 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .summary h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 32px;
            color: var(--charcoal);
            margin-bottom: 12px;
        }

        .summary-stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 24px 0 32px;
            flex-wrap: wrap;
        }

        .stat {
            background: white;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
        }

        .stat-number {
            font-family: 'Fredoka', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--coral);
            display: block;
        }

        .stat-label {
            font-size: 13px;
            color: var(--charcoal);
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-top: 4px;
        }

        .liked-cats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 24px;
            width: 100%;
            max-width: 100%;
        }

        .liked-cat {
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .liked-cat:hover {
            transform: scale(1.05);
        }

        .liked-cat:nth-child(1) { animation-delay: 0.05s; }
        .liked-cat:nth-child(2) { animation-delay: 0.1s; }
        .liked-cat:nth-child(3) { animation-delay: 0.15s; }
        .liked-cat:nth-child(4) { animation-delay: 0.2s; }
        .liked-cat:nth-child(5) { animation-delay: 0.25s; }
        .liked-cat:nth-child(6) { animation-delay: 0.3s; }
        .liked-cat:nth-child(7) { animation-delay: 0.35s; }
        .liked-cat:nth-child(8) { animation-delay: 0.4s; }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .liked-cat img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .restart-btn {
            margin-top: 32px;
            padding: 16px 48px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--coral), var(--mint));
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.3);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.6s ease-out;
        }

        .empty-state-emoji {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            color: var(--charcoal);
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--charcoal);
            opacity: 0.6;
            font-size: 15px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 32px;
            }

            .card-stack {
                max-width: 90%;
            }

            .action-btn.like {
                width: 72px;
                height: 72px;
                font-size: 32px;
            }

            .action-btn.nope {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }

            .liked-cats {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐱 Meowmatch</h1>
            <p class="subtitle">Swipe to find your purrfect cats</p>
        </header>

        <div class="main-content">
            <div id="loadingState" class="loading">
                Loading adorable cats
            </div>

            <div id="swipeState" class="hidden">
                <div class="card-stack" id="cardStack"></div>
                <div class="card-counter" id="cardCounter"></div>
                <div class="action-buttons">
                    <button class="action-btn nope" id="nopeBtn" aria-label="Dislike">✕</button>
                    <button class="action-btn like" id="likeBtn" aria-label="Like">♡</button>
                </div>
            </div>

            <div id="summaryState" class="summary hidden"></div>
        </div>
    </div>

    <script>
        // Hardcoded cat image paths - Place your images in the "Images" folder
        const HARDCODED_CATS = [
            'Images/cat1.jpg',
            'Images/cat2.jpg',
            // 'Images/cat3.jpg',
            // 'Images/cat4.jpg',
            // 'Images/cat5.jpg',
            // 'Images/cat6.jpg',
            // 'Images/cat7.jpg',
            // 'Images/cat8.jpg',
            // 'Images/cat9.jpg',
            // 'Images/cat10.jpg'
        ];

        let cats = [];
        let currentIndex = 0;
        let likedCats = [];
        let currentCard = null;
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let currentY = 0;
        let isDragging = false;

        // Load hardcoded images
        async function loadCats() {
            const promises = HARDCODED_CATS.map(url => preloadImage(url));
            cats = await Promise.all(promises);
            startApp();
        }

        function preloadImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = () => resolve(url); // Still resolve even if error
                img.src = url;
            });
        }

        function startApp() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('swipeState').classList.remove('hidden');
            renderCards();
            updateCounter();
        }

        function renderCards() {
            const stack = document.getElementById('cardStack');
            stack.innerHTML = '';

            // Render next 3 cards for depth effect
            for (let i = Math.min(currentIndex + 2, cats.length - 1); i >= currentIndex; i--) {
                const card = createCard(i);
                stack.appendChild(card);
            }

            // Setup interaction for top card
            if (currentIndex < cats.length) {
                currentCard = stack.lastElementChild;
                setupCardInteraction(currentCard);
            }
        }

        function createCard(index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.index = index;
            
            const depth = index - currentIndex;
            const scale = 1 - (depth * 0.05);
            const translateY = depth * 10;
            
            card.style.transform = `scale(${scale}) translateY(${translateY}px)`;
            card.style.zIndex = cats.length - depth;
            
            card.innerHTML = `
                <img src="${cats[index]}" alt="Cat ${index + 1}" draggable="false">
                <div class="card-overlay"></div>
                <div class="card-indicator like">Like</div>
                <div class="card-indicator nope">Nope</div>
            `;
            
            return card;
        }

        function setupCardInteraction(card) {
            // Touch events
            card.addEventListener('touchstart', handleDragStart, { passive: true });
            card.addEventListener('touchmove', handleDragMove, { passive: false });
            card.addEventListener('touchend', handleDragEnd);

            // Mouse events
            card.addEventListener('mousedown', handleDragStart);
            document.addEventListener('mousemove', handleDragMove);
            document.addEventListener('mouseup', handleDragEnd);
        }

        function handleDragStart(e) {
            if (e.type === 'mousedown' && e.target !== currentCard && !currentCard.contains(e.target)) return;
            
            isDragging = true;
            const touch = e.touches ? e.touches[0] : e;
            startX = touch.clientX;
            startY = touch.clientY;
            currentCard.style.transition = 'none';
        }

        function handleDragMove(e) {
            if (!isDragging || !currentCard) return;
            
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            currentX = touch.clientX - startX;
            currentY = touch.clientY - startY;

            const rotate = currentX * 0.1;
            currentCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

            // Show indicators
            if (Math.abs(currentX) > 20) {
                currentCard.classList.add('swiping');
                if (currentX > 0) {
                    currentCard.classList.add('swiping-right');
                    currentCard.classList.remove('swiping-left');
                } else {
                    currentCard.classList.add('swiping-left');
                    currentCard.classList.remove('swiping-right');
                }
            } else {
                currentCard.classList.remove('swiping', 'swiping-right', 'swiping-left');
            }
        }

        function handleDragEnd(e) {
            if (!isDragging || !currentCard) return;
            
            isDragging = false;
            currentCard.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';

            const threshold = 100;
            
            if (Math.abs(currentX) > threshold) {
                // Swiped
                const direction = currentX > 0 ? 'right' : 'left';
                swipeCard(direction);
            } else {
                // Return to center
                currentCard.style.transform = '';
                currentCard.classList.remove('swiping', 'swiping-right', 'swiping-left');
            }

            currentX = 0;
            currentY = 0;
        }

        function swipeCard(direction) {
            if (!currentCard) return;

            const moveX = direction === 'right' ? window.innerWidth : -window.innerWidth;
            const rotate = direction === 'right' ? 30 : -30;
            
            currentCard.style.transform = `translate(${moveX}px, 100px) rotate(${rotate}deg)`;
            currentCard.style.opacity = '0';

            if (direction === 'right') {
                likedCats.push(cats[currentIndex]);
            }

            setTimeout(() => {
                currentIndex++;
                updateCounter();

                if (currentIndex >= cats.length) {
                    showSummary();
                } else {
                    renderCards();
                }
            }, 400);
        }

        function updateCounter() {
            const counter = document.getElementById('cardCounter');
            counter.textContent = `${currentIndex + 1} / ${cats.length}`;
        }

        function showSummary() {
            document.getElementById('swipeState').classList.add('hidden');
            const summaryDiv = document.getElementById('summaryState');
            summaryDiv.classList.remove('hidden');

            const disliked = cats.length - likedCats.length;
            
            let content = `
                <h2>🎉 All Done!</h2>
                <div class="summary-stats">
                    <div class="stat">
                        <span class="stat-number">${likedCats.length}</span>
                        <span class="stat-label">Liked</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">${disliked}</span>
                        <span class="stat-label">Passed</span>
                    </div>
                </div>
            `;

            if (likedCats.length > 0) {
                content += '<div class="liked-cats">';
                likedCats.forEach(url => {
                    content += `
                        <div class="liked-cat">
                            <img src="${url}" alt="Liked cat">
                        </div>
                    `;
                });
                content += '</div>';
            } else {
                content += `
                    <div class="empty-state">
                        <div class="empty-state-emoji">😿</div>
                        <h3>No Cats Liked</h3>
                        <p>Maybe try again and give some kitties a chance?</p>
                    </div>
                `;
            }

            content += '<button class="restart-btn" onclick="restartApp()">Play Again</button>';
            
            summaryDiv.innerHTML = content;
        }

        function restartApp() {
            currentIndex = 0;
            likedCats = [];
            document.getElementById('summaryState').classList.add('hidden');
            document.getElementById('swipeState').classList.remove('hidden');
            renderCards();
            updateCounter();
        }

        // Button handlers
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('likeBtn').addEventListener('click', () => {
                if (currentCard) {
                    currentCard.classList.add('swiping', 'swiping-right');
                    setTimeout(() => swipeCard('right'), 100);
                }
            });

            document.getElementById('nopeBtn').addEventListener('click', () => {
                if (currentCard) {
                    currentCard.classList.add('swiping', 'swiping-left');
                    setTimeout(() => swipeCard('left'), 100);
                }
            });

            loadCats();
        });

        // Cleanup mouse events when not needed
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
            }
        });
    </script>
</body>
</html>
