<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purr-fect Match - Cat Preference Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐱 Purr-fect Match</h1>
            <p>Swipe or tap to find your favorite cats!</p>
        </div>

        <div id="swipeSection">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="card-stack" id="cardStack"></div>

            <div class="controls">
                <button class="control-btn like" id="likeBtn">♥</button>
                <button class="control-btn next" id="nextBtn">→</button>
            </div>
        </div>

        <div class="results" id="results">
            <div class="results-header">
                <h2>✨ Your Purr-fect Matches! ✨</h2>
            </div>

            <div class="results-stats">
                <div class="stats-number" id="likedCount">0</div>
                <div class="stats-label">cats you loved</div>
            </div>

            <div id="likedCatsContainer"></div>

            <button class="restart-btn" onclick="restart()">Start Over</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
